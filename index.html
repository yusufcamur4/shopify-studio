<!doctype html>
<!--
  ============================================================
  PLACEHOLDER'LAR — tek yerde topla, kolay değiştir:
  [STUDIO_NAME] = "OB°"
  [FULL_NAME]   = "Okan Bayraktar"
  [EMAIL]       = "hello@eokanbayraktar.com"
  [DOMAIN]      = "eokanbayraktar.com"
  [LOCATION]    = "İstanbul · Uzaktan"
  ============================================================
-->
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- CMS:SEO — title/description/OG content/seo/home.json'dan basilir; panelden yonet -->
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <!-- ============== GLOBAL SAYFA GEÇİŞ PERDESİ ============== -->
  <div class="curtain" id="curtain" aria-hidden="true"><span class="curtain__mark">OB°</span></div>

  <!-- custom dual cursor -->
  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"><span class="label">incele</span></div>

  <!-- ========================= NAV ========================= -->
  <header class="nav">
    <div class="nav__left">
      <a href="#hero" class="nav__mark logo3d" data-link aria-label="OB° — ana sayfa">
        <span class="ch">O</span><span class="ch">B</span><span class="ch dot">°</span>
      </a>
      <button class="nav__back" id="navBack" type="button" aria-label="Menüye geri dön">
        <span class="nav__back-ico" aria-hidden="true">←</span><!-- CMS:NAVBACK -->
      </button>
    </div>
    <div class="nav__right">
      <div class="lang" id="lang" aria-label="Dil seçimi">
        <button type="button" data-lang="tr" class="is-active">TR</button><span class="sep">/</span><button type="button" data-lang="en">EN</button>
      </div>
      <button class="menu-trigger" id="menuTrigger" aria-expanded="false" aria-controls="menuField">
        <span class="menu-trigger__label" data-i18n="menu">Menü</span>
        <span class="menu-trigger__glyph" aria-hidden="true"><span></span><span></span><span></span></span>
      </button>
    </div>
  </header>

  <!-- =================== PENTA-STİLİ OVERLAY MENÜ ================== -->
  <div class="menu-field" id="menuField" aria-hidden="true">
    <div class="menu-bg" aria-hidden="true"></div>

    <button class="menu-ctl" id="menuCtl" aria-label="Kapat">
      <span class="menu-ctl__ico menu-ctl__ico--close" aria-hidden="true"></span>
      <span class="menu-ctl__ico menu-ctl__ico--back" aria-hidden="true"></span>
    </button>

    <nav class="menu-levels" aria-label="Site menüsü">
      <!-- Seviye 0 -->
      <ul class="menu-level" data-level="0">
        <li class="menu-item"><a class="menu-link" href="#about" data-link data-i18n="m_about">Hakkımda</a></li>
        <li class="menu-item has-child"><button class="menu-link" data-open="yetenekler" data-i18n="m_skills">Yetenekler</button></li>
        <li class="menu-item"><a class="menu-link" href="#works" data-link data-i18n="m_works">İşler</a></li>
        <li class="menu-item"><a class="menu-link" href="#process" data-link data-i18n="m_process">Süreç</a></li>
        <li class="menu-item"><a class="menu-link" href="#contact" data-link data-i18n="m_contact">İletişim</a></li>
      </ul>
      <!-- Seviye 1 — Yetenekler -->
      <!-- CMS:MENUSUB — alt menü content/sections/menu.json'dan basilir -->
    </nav>

    <div class="menu-meta">
      <!-- CMS:MENUMETA -->
    </div>

    <!-- Müşteri deneyim videosu — menü açıkken sağ köşede oynar (dosya yüklenince belirir) -->
    <figure class="menu-testimonial" id="menuTestimonial">
      <div class="menu-testimonial__frame">
        <video class="menu-testimonial__video" id="menuVideo" muted loop playsinline preload="metadata">
          <source src="videos/musteri-deneyim.mp4" type="video/mp4" />
        </video>
        <button class="menu-testimonial__sound" id="menuVideoSound" type="button" aria-label="Sesi aç">
          <span aria-hidden="true">🔇</span>
        </button>
      </div>
      <!-- CMS:MENUCAPTION -->
    </figure>
  </div>

  <!-- ========================= HERO ======================== -->
  <section class="hero hero--3d" id="hero" data-page="home">
    <div class="hero__bg" aria-hidden="true">
      <video class="hero__video" id="heroVideo" autoplay muted loop playsinline preload="auto"></video>
      <span class="hero__video-overlay"></span>
      <span class="hero__video-fade"></span>
    </div>

    <div class="hero__content">
      <!-- CMS:HERO — hero metinleri content/sections/hero.json'dan basilir; panelden yonet -->
    </div>

    <div class="hero__scroll">
      <span class="rail"></span>
      <!-- CMS:HEROSCROLL -->
    </div>
  </section>

  <!-- ======================= MARQUEE ======================= -->
  <div class="marquee" aria-hidden="true" data-page="home">
    <div class="marquee__track" data-marquee>
      <!-- CMS:MARQUEE1 -->
    </div>
  </div>
  <div class="marquee" aria-hidden="true" data-page="home">
    <div class="marquee__track rev" data-marquee>
      <!-- CMS:MARQUEE2 -->
    </div>
  </div>

  <!-- ====================== 01 HAKKIMDA ===================== -->
  <section class="section" id="about" data-page="about">
    <span class="folio mono">s. 014</span>
    <hr class="hairline" />
    <div class="about" data-reveal style="margin-top:clamp(40px,7vh,90px)">
      <!-- CMS:ABOUT — hakkinda metinleri content/sections/about.json'dan basilir; panelden yonet -->
    </div>
  </section>

  <!-- ==================== 02 SEÇİLİ İŞLER =================== -->
  <section class="section" id="works" data-page="works">
    <span class="folio mono">s. 028</span>
    <div class="crumbs" data-reveal><span data-i18n="crumb_home">Anasayfa</span><span class="sep">/</span><span data-i18n="m_works">İşler</span></div>
    <div class="sec-head" data-reveal>
      <span class="idx">02</span>
      <h2 class="sec-title" data-i18n="works_title">Daha Önce Yapılan İşler</h2>
    </div>
    <div class="works">
      <!-- CMS:WORKS — kartlar content/projects/*.md dosyalarindan uretilir; panelden yonet -->
    </div>
  </section>

  <!-- ===================== 03 YETENEKLER ==================== -->
  <section class="section" id="skills" data-page="skills">
    <span class="folio mono">s. 041</span>
    <div class="crumbs" data-reveal><span data-i18n="crumb_home">Anasayfa</span><span class="sep">/</span><span data-i18n="m_skills">Yetenekler</span></div>
    <div class="sec-head" data-reveal>
      <span class="idx">03</span>
      <h2 class="sec-title" data-i18n="skills_title">Yetenekler</h2>
    </div>
    <!-- CMS:SKILLSLEDE -->
    <div class="skills">
      <!-- CMS:SKILLS — kartlar content/sections/skills.json'dan basilir; panelden yonet -->
    </div>
    <div class="techstack" data-reveal aria-hidden="true">
      <!-- CMS:TECHSTACK -->
    </div>
  </section>

  <!-- ============ HİZMET LANDING · SHOPIFY DANIŞMANLIĞI ============ -->
  <section class="section lp" id="skill-shopify" data-page="skill-shopify">
    <!-- CMS:LP_SHOPIFY — content/landings/shopify.json'dan basilir; panelden yonet -->
  </section>

  <!-- ============ HİZMET LANDING · WEB & E-TİCARET ============ -->
  <section class="section lp" id="skill-web" data-page="skill-web">
    <!-- CMS:LP_WEB — content/landings/web.json'dan basilir; panelden yonet -->
  </section>

  <!-- ============ HİZMET LANDING · SIFIRDAN ÖZEL TEMA ============ -->
  <section class="section lp" id="skill-tema" data-page="skill-tema">
    <!-- CMS:LP_TEMA — content/landings/tema.json'dan basilir; panelden yonet -->
  </section>

  <!-- ============ HİZMET LANDING · PERFORMANS, SEO & BAKIM ============ -->
  <section class="section lp" id="skill-seo" data-page="skill-seo">
    <!-- CMS:LP_SEO — content/landings/seo.json'dan basilir; panelden yonet -->
  </section>

  <!-- ============ HİZMET LANDING · DİJİTAL PAZARLAMA ============ -->
  <section class="section lp" id="skill-pazarlama" data-page="skill-pazarlama">
    <!-- CMS:LP_PAZARLAMA — content/landings/pazarlama.json'dan basilir; panelden yonet -->
  </section>

  <!-- ====================== 04 SÜREÇ ======================= -->
  <section class="process" id="process" data-page="process">
    <div class="process__pin">
      <div class="process__head">
        <!-- CMS:PROCESSHEAD -->
      </div>
      <div class="process__rail" data-rail>
        <!-- CMS:PROCESS — adımlar content/sections/process.json'dan basilir; panelden yonet -->
      </div>
      <div class="process__progress"><div class="bar"><i data-progress></i></div></div>
    </div>
  </section>


  <!-- ====================== 05 İLETİŞİM ==================== -->
  <section class="contact" id="contact" data-page="contact">
    <div class="contact__inner">
      <!-- CMS:CONTACT — iletisim metni content/sections/contact.json + content/settings/contact.json'dan basilir -->
    </div>
  </section>

  <!-- ======================= FOOTER ======================== -->
  <footer class="footer">
    <div class="footer__inner">
      <!-- CMS:FOOTER — footer content/sections/footer.json + content/settings/contact.json'dan basilir -->
    </div>
  </footer>

  <!-- ==================== EN ÜSTE DÖN ===================== -->
  <button class="to-top" id="toTop" type="button" aria-label="Sayfanın en üstüne dön">
    <span class="to-top__arrow" aria-hidden="true">↑</span>
  </button>

  <!-- ==================== İLETİŞİM MODAL =================== -->
  <div class="modal" id="contactModal" aria-hidden="true">
    <div class="modal__backdrop" data-modal-close></div>
    <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal__close" type="button" data-modal-close aria-label="Kapat">×</button>
      <div class="modal__grid">
        <!-- CMS:FORM — modal aside + form content/form/settings.json + content/settings/contact.json'dan basilir -->
      </div>
    </div>
  </div>

  <!-- CMS:HEROJS -->
  <!-- CMS:I18NJS -->
  <script type="module" src="/main.js"></script>
</body>
</html>
